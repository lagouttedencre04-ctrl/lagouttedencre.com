<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Espace pro — La Goutte d'Encre</title>
<link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
<style>
.pw-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f3ee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px}
.pw-card{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.12);padding:36px 32px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.pw-card h1{font-size:20px;margin:0 0 4px;color:#111}
.pw-card p{font-size:14px;color:#555;margin:0 0 6px;line-height:1.5}
.pw-card input{font-size:16px;padding:12px 14px;border:1px solid #d6d1c6;border-radius:8px}
.pw-card button{font-size:15px;padding:13px;border:0;border-radius:8px;background:#0b8a4f;color:#fff;cursor:pointer}
.pw-card button:disabled{opacity:.6}
.pw-msg{font-size:14px;min-height:20px;color:#b3261e}
.pw-msg.ok{color:#0b8a4f}
a{color:#0b8a4f}a:hover{color:#086b3d}
</style>
</head>
<body>
<script>
(function(){
  var h = location.hash;
  var m = h.match(/(recovery|invite)_token=([^&]+)/);
  function loadCMS(){
    var w = document.createElement('script');
    w.src = 'https://identity.netlify.com/v1/netlify-identity-widget.js';
    w.onload = function(){
      var d = document.createElement('script');
      d.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(d);
    };
    document.head.appendChild(w);
  }
  if (!m) { loadCMS(); return; }
  var type = m[1], token = decodeURIComponent(m[2]);
  history.replaceState(null, '', location.pathname);
  var wrap = document.createElement('div');
  wrap.className = 'pw-wrap';
  wrap.innerHTML = '<form class="pw-card"><h1>' + (type === 'invite' ? 'Créer votre mot de passe' : 'Nouveau mot de passe') + '</h1>'
    + '<p>Espace pro — La Goutte d\'Encre</p>'
    + '<input type="password" id="pw1" placeholder="Nouveau mot de passe (8 caractères min.)" minlength="8" required autocomplete="new-password">'
    + '<input type="password" id="pw2" placeholder="Confirmer le mot de passe" minlength="8" required autocomplete="new-password">'
    + '<button type="submit">Enregistrer</button><div class="pw-msg" id="pwmsg"></div></form>';
  document.body.appendChild(wrap);
  var form = wrap.querySelector('form'), msg = wrap.querySelector('#pwmsg'), btn = wrap.querySelector('button');
  var api = '/.netlify/identity';
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var p1 = form.querySelector('#pw1').value, p2 = form.querySelector('#pw2').value;
    msg.className = 'pw-msg';
    if (p1 !== p2) { msg.textContent = 'Les deux mots de passe ne sont pas identiques.'; return; }
    btn.disabled = true; msg.textContent = 'Enregistrement…';
    var body = type === 'invite' ? { type: 'signup', token: token, password: p1 } : { type: 'recovery', token: token };
    fetch(api + '/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw j; return j; }); })
      .then(function(j){
        if (type === 'invite') return j;
        return fetch(api + '/user', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + j.access_token }, body: JSON.stringify({ password: p1 }) })
          .then(function(r){ if (!r.ok) return r.json().then(function(x){ throw x; }); });
      })
      .then(function(){
        msg.className = 'pw-msg ok';
        msg.innerHTML = 'Mot de passe enregistré ✓ Redirection vers la connexion…';
        setTimeout(function(){ location.href = '/admin/'; }, 1800);
      })
      .catch(function(err){
        btn.disabled = false;
        var t = (err && (err.msg || err.error_description || err.error)) || '';
        msg.innerHTML = /expired|invalid|not found/i.test(t)
          ? 'Ce lien a expiré ou a déjà été utilisé. Retournez sur <a href="/admin/">l\'Espace pro</a> et cliquez « Forgot password? » pour en recevoir un nouveau.'
          : 'Erreur : ' + (t || 'réessayez dans un instant.');
      });
  });
})();
</script>
</body>
</html>
